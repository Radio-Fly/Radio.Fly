
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Metadatos para SEO y Redes Sociales -->
    <title>RADIO FLY - En Vivo</title>
    <meta name="description" content="Escucha la mejor música en vivo a través de nuestra Radio Online. Transmisión de alta calidad 24/7.">
    <meta name="theme-color" content="#0f172a">
    
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="music.radio_station">
    <meta property="og:url" content="https://stream.zeno.fm/67ep5htcxf9uv">
    <meta property="og:title" content="RADIO FLY Player">
    <meta property="og:description" content="Escucha nuestra transmisión en vivo con la mejor calidad de audio.">
    <meta property="og:image" content="https://ui-avatars.com/api/?name=RADIO+FLY&background=ec4899&color=fff&size=512">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="RADIO FLY Player">
    <meta property="twitter:description" content="Escucha nuestra transmisión en vivo con la mejor calidad de audio.">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            color: white;
            overflow: hidden; 
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ec4899;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #334155;
            border-radius: 2px;
        }
        
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .live-indicator {
            animation: pulse-red 2s infinite;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Animation classes for smooth image transitions */
        .album-art-transition {
            transition: opacity 0.5s ease-in-out;
            opacity: 0;
        }
        .album-art-visible {
            opacity: 1;
        }

        /* --- VINYL RECORD STYLES --- */
        .vinyl-container {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background-color: #111;
            /* Texture for grooves */
            background-image: repeating-radial-gradient(
                #111 0, 
                #111 2px, 
                #222 3px, 
                #111 4px
            );
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Realistic shine effect on vinyl */
        .vinyl-shine {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 40%, transparent 60%, rgba(255,255,255,0.1) 100%);
            pointer-events: none;
            z-index: 2;
        }

        .vinyl-label {
            width: 35%;
            height: 35%;
            background: #1e1e1e; 
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative; /* For absolute positioning of hole/image */
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 3;
            border: 2px solid rgba(255,255,255,0.1);
        }
        
        .vinyl-hole {
            width: 12px;
            height: 12px;
            background-color: #000;
            border-radius: 50%;
            position: absolute;
            z-index: 10; /* Hole stays on top of image */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Spin Animation */
        @keyframes spin-record {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* Class to trigger animation */
        .is-spinning {
            animation: spin-record 4s linear infinite;
        }
        
        /* Pause animation but keep rotation state when paused */
        .is-paused {
            animation-play-state: paused;
        }
        
        /* Listener count animation */
        .fade-text {
            animation: fadeText 0.5s ease-in-out;
        }
        @keyframes fadeText {
            0% { opacity: 0.5; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

    </style>
</head>
<body class="h-screen w-full flex items-center justify-center bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900">

    <div class="relative w-full max-w-md h-full sm:h-auto sm:rounded-3xl glass-panel shadow-2xl overflow-hidden flex flex-col">
        
        <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-64 h-64 bg-pink-500 rounded-full blur-[100px] opacity-20 pointer-events-none"></div>

        <!-- Header -->
        <div class="flex justify-between items-center p-6 z-10">
            <button class="text-slate-400 hover:text-white transition"><i class="fas fa-chevron-down"></i></button>
            <span class="text-xs font-bold tracking-widest text-slate-400 uppercase">Radio Online</span>
            <!-- Refresh Metadata Button -->
            <button id="refreshMetaBtn" class="text-slate-400 hover:text-white transition" title="Actualizar Datos"><i class="fas fa-sync-alt"></i></button>
        </div>

        <!-- Album Art / Logo Area -->
        <div class="flex-1 flex flex-col items-center justify-center p-6 z-10">
            <!-- Main Disc Container -->
            <div id="discContainer" class="w-64 h-64 rounded-full shadow-2xl border-4 border-slate-700/50 relative mb-6 overflow-hidden flex-shrink-0">
                
                <!-- 1. BASE LAYER: Vinyl Record (CSS Generated) -->
                <div id="vinylRecord" class="vinyl-container">
                    <div class="vinyl-shine"></div>
                    <div class="vinyl-label">
                        <!-- Black hole in the center -->
                        <div class="vinyl-hole"></div>
                        
                        <!-- CENTER IMAGE -->
                        <img id="centerLabel" 
                             src="https://i.postimg.cc/WzByDZNW/Untitled-1.png" 
                             alt="Logo" 
                             class="absolute inset-0 w-full h-full object-cover">
                    </div>
                </div>
                
                <!-- 2. OVERLAY LAYER: Album Art (Fades in on top) -->
                <img id="albumCover" 
                     src="" 
                     alt="Album Art" 
                     class="absolute inset-0 w-full h-full object-cover rounded-full transition-opacity duration-700 opacity-0 z-20" 
                     style="pointer-events: none;" />

                <!-- Spinner -->
                <div id="loadingSpinner" class="absolute inset-0 border-4 border-t-pink-500 border-r-transparent border-b-transparent border-l-transparent rounded-full animate-spin hidden z-30"></div>
            </div>

            <!-- Metadata Info (Dynamic) -->
            <div class="w-full text-center overflow-hidden px-4 min-h-[80px]">
                <!-- Debug Info (Small) -->
                <p id="debugInfo" class="text-[10px] text-slate-500 font-mono mb-1 truncate opacity-50">Esperando señal...</p>
                
                <h2 id="songTitle" class="text-2xl font-bold text-white mb-1 leading-tight line-clamp-2">RADIO FLY</h2>
                <p id="artistName" class="text-pink-400 text-sm font-medium tracking-wide truncate">Frecuencia Digital</p>
            </div>
        </div>

        <!-- Visualizer Canvas -->
        <div class="w-full h-24 relative z-10 px-6">
            <canvas id="visualizer" class="w-full h-full"></canvas>
        </div>

        <!-- Controls Area -->
        <div class="bg-slate-900/80 p-6 pb-10 z-10 rounded-t-3xl border-t border-white/5">
            
            <!-- Progress / Live Status -->
            <div class="flex justify-between items-center mb-6">
                <!-- Left: Status -->
                <div class="flex items-center gap-2">
                    <span id="liveBadge" class="w-2 h-2 rounded-full bg-red-500 hidden live-indicator"></span>
                    <span id="statusText" class="text-xs font-medium text-slate-400">Desconectado</span>
                </div>

                <!-- Right: Listeners Counter (Added) -->
                <div class="flex items-center gap-2 text-xs font-mono text-pink-400 bg-slate-800/50 px-3 py-1 rounded-full border border-slate-700/50">
                    <i class="fas fa-users text-[10px]"></i>
                    <span id="listenerCount">42</span>
                </div>
            </div>

            <!-- Main Buttons -->
            <div class="flex justify-between items-center mb-8">
                <button class="text-slate-400 hover:text-white transition"><i class="fas fa-backward-step text-xl"></i></button>
                
                <button id="playBtn" class="w-16 h-16 rounded-full bg-pink-600 hover:bg-pink-500 text-white flex items-center justify-center shadow-lg shadow-pink-600/40 transition transform hover:scale-105 active:scale-95">
                    <i class="fas fa-play text-2xl ml-1"></i>
                </button>
                
                <button class="text-slate-400 hover:text-white transition"><i class="fas fa-forward-step text-xl"></i></button>
            </div>

            <!-- Volume Control -->
            <div class="flex items-center gap-4 text-slate-400">
                <i class="fas fa-volume-low text-xs"></i>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
                <i class="fas fa-volume-high text-xs"></i>
            </div>

        </div>

        <!-- Audio Element -->
        <audio id="audioPlayer" crossorigin="anonymous">
            <source src="https://stream.zeno.fm/67ep5htcxf9uv" type="audio/mpeg">
            Tu navegador no soporta el elemento de audio.
        </audio>

    </div>

    <script>
        // DOM Elements
        const playBtn = document.getElementById('playBtn');
        const refreshMetaBtn = document.getElementById('refreshMetaBtn');
        const player = document.getElementById('audioPlayer');
        const playIcon = playBtn.querySelector('i');
        const statusText = document.getElementById('statusText');
        const liveBadge = document.getElementById('liveBadge');
        const volumeSlider = document.getElementById('volumeSlider');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const songTitleEl = document.getElementById('songTitle');
        const artistNameEl = document.getElementById('artistName');
        const albumCoverEl = document.getElementById('albumCover');
        const listenerCountEl = document.getElementById('listenerCount');
        
        // Vinyl Elements
        const vinylRecordEl = document.getElementById('vinylRecord');
        const discContainerEl = document.getElementById('discContainer');
        
        const debugInfoEl = document.getElementById('debugInfo');
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');

        // State
        let isPlaying = false;

        // --- LISTENER SIMULATION LOGIC ---
        // Retrieve saved listeners from LocalStorage or start at 42
        let currentListeners = parseInt(localStorage.getItem('radioFlyListeners')) || 42;
        if (currentListeners < 42) currentListeners = 42;
        listenerCountEl.textContent = currentListeners;

        function simulateListeners() {
            const roll = Math.random();
            let change = 0;

            if (currentListeners < 130) {
                if (roll < 0.75) { 
                    change = Math.floor(Math.random() * 2) + 1; 
                } else if (roll > 0.9) { 
                    change = -1;
                }
            } else {
                change = (Math.random() < 0.5) ? -1 : 1;
            }

            currentListeners += change;
            if (currentListeners < 42) currentListeners = 42;

            listenerCountEl.textContent = currentListeners;
            listenerCountEl.classList.remove('fade-text');
            void listenerCountEl.offsetWidth; 
            listenerCountEl.classList.add('fade-text');

            localStorage.setItem('radioFlyListeners', currentListeners);
            
            const nextUpdate = Math.floor(Math.random() * (180000 - 40000 + 1)) + 40000;
            // console.log(`Next listener update in: ${nextUpdate/1000}s`);
            
            setTimeout(simulateListeners, nextUpdate);
        }

        setTimeout(simulateListeners, 60000); 

        
        // --- ZENO FM METADATA CONFIGURATION ---
        const MOUNT_KEY = "67ep5htcxf9uv"; 
        const METADATA_URL = `https://api.zeno.fm/mounts/metadata/subscribe/${MOUNT_KEY}`;
        let eventSource = null;
        let reconnectTimeout = null;

        function connectMetadata() {
            if (eventSource && eventSource.readyState !== 2) return; 

            if (window.EventSource) {
                console.log("Iniciando conexión de metadatos...");
                debugInfoEl.textContent = "Conectando datos...";
                
                eventSource = new EventSource(METADATA_URL);

                eventSource.onopen = function() {
                    debugInfoEl.textContent = "Datos conectados";
                };

                eventSource.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.streamTitle) {
                            updateMetadataUI(data.streamTitle);
                        }
                    } catch (e) {
                        console.error("Error parsing metadata", e);
                    }
                };

                eventSource.onerror = function(err) {
                    debugInfoEl.textContent = "Reconectando...";
                    eventSource.close();
                    eventSource = null;
                    clearTimeout(reconnectTimeout);
                    reconnectTimeout = setTimeout(connectMetadata, 3000);
                };
            }
        }

        refreshMetaBtn.addEventListener('click', () => {
            debugInfoEl.textContent = "Refrescando...";
            if(eventSource) eventSource.close();
            connectMetadata();
            const icon = refreshMetaBtn.querySelector('i');
            icon.classList.add('fa-spin');
            setTimeout(() => icon.classList.remove('fa-spin'), 1000);
        });

        // --- ALBUM ART FETCHING (ITUNES API) ---
        let currentSearchTerm = "";

        async function fetchAlbumArt(artist, song) {
            const query = `${artist} ${song}`;
            
            const cleanQuery = query
                .replace(/ft\.|feat\.|featuring/gi, "")
                .replace(/\(.*\)/g, "")
                .replace(/\[.*\]/g, "")
                .replace(/official video/gi, "")
                .replace(/lyric video/gi, "")
                .trim();

            if (cleanQuery === currentSearchTerm) return;
            currentSearchTerm = cleanQuery;
            
            if (!cleanQuery || cleanQuery.toUpperCase().includes("RADIO FLY")) {
                hideAlbumArt();
                return;
            }

            const encodedTerm = encodeURIComponent(cleanQuery);
            const url = `https://itunes.apple.com/search?term=${encodedTerm}&media=music&entity=song&limit=1`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.resultCount > 0) {
                    const artworkUrl = data.results[0].artworkUrl100.replace('100x100', '600x600');
                    showAlbumArt(artworkUrl);
                } else {
                    console.log("No album found for song, falling back to vinyl.");
                    hideAlbumArt();
                }
            } catch (error) {
                console.error("Error fetching album art:", error);
                hideAlbumArt();
            }
        }

        function showAlbumArt(url) {
            if(albumCoverEl.src === url && albumCoverEl.style.opacity === "1") return;

            albumCoverEl.src = url;
            albumCoverEl.onload = () => {
                albumCoverEl.style.opacity = "1"; // Fade In Album Art
                // Stop spinning when art is visible so it stays upright
                discContainerEl.classList.remove('is-spinning');
                discContainerEl.style.transform = 'rotate(0deg)'; 
            };
        }

        function hideAlbumArt() {
            if (albumCoverEl.style.opacity === "0") return;
            
            albumCoverEl.style.opacity = "0"; // Fade Out
            
            // Resume spinning if currently playing
            if (isPlaying) {
                discContainerEl.classList.add('is-spinning');
                discContainerEl.style.animationPlayState = 'running';
                discContainerEl.style.transform = ''; 
            }
        }

        function updateMetadataUI(rawTitle) {
            debugInfoEl.textContent = "Info: " + rawTitle.substring(0, 25);
            
            if (!rawTitle) return;

            const parts = rawTitle.split(' - ');
            let artist = "RADIO FLY";
            let song = rawTitle;

            if (parts.length >= 2) {
                artist = parts[0].trim();
                song = parts.slice(1).join(' - ').trim(); 
            }

            if (songTitleEl.textContent !== song || artistNameEl.textContent !== artist) {
                songTitleEl.textContent = song;
                artistNameEl.textContent = artist;
                
                fetchAlbumArt(artist, song);
            }
        }

        // --- VISUALIZER ---
        let animationId;
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);

        const barCount = 40; 
        const barSpacing = 2;
        let bars = new Array(barCount).fill(0);

        playBtn.addEventListener('click', togglePlay);

        function togglePlay() {
            if (isPlaying) {
                pauseRadio();
            } else {
                playRadio();
            }
        }

        function playRadio() {
            statusText.textContent = "Conectando...";
            loadingSpinner.classList.remove('hidden');
            
            connectMetadata(); 

            player.play().then(() => {
                isPlaying = true;
                updateUIState(true);
                startVisualizer();
            }).catch(error => {
                console.error("Error playback:", error);
                statusText.textContent = "Error de conexión";
                loadingSpinner.classList.add('hidden');
            });
        }

        function pauseRadio() {
            player.pause();
            isPlaying = false;
            updateUIState(false);
            stopVisualizer();
        }

        function updateUIState(playing) {
            const isArtVisible = albumCoverEl.style.opacity === "1";

            if (playing) {
                playIcon.classList.remove('fa-play', 'ml-1');
                playIcon.classList.add('fa-pause');
                statusText.textContent = "En Vivo";
                statusText.classList.add('text-pink-400');
                liveBadge.classList.remove('hidden');
                loadingSpinner.classList.add('hidden');
                
                // --- VINYL ANIMATION LOGIC ---
                // Only spin if we are NOT showing the square album art
                if (!isArtVisible) {
                    discContainerEl.classList.add('is-spinning');
                    discContainerEl.style.animationPlayState = 'running';
                }
                
            } else {
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play', 'ml-1');
                statusText.textContent = "Pausado";
                statusText.classList.remove('text-pink-400');
                liveBadge.classList.add('hidden');
                
                // Stop Animation
                discContainerEl.style.animationPlayState = 'paused';
            }
        }

        volumeSlider.addEventListener('input', (e) => {
            player.volume = e.target.value;
        });

        function drawVisualizer() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const width = canvas.clientWidth / barCount;
            
            for (let i = 0; i < barCount; i++) {
                const wave = Math.sin(i * 0.2 + Date.now() * 0.002);
                const impulse = (Math.random() > 0.5) ? Math.random() * 30 : 0;
                const centerBias = 1 - Math.abs(i - barCount / 2) / (barCount / 2);
                const targetHeight = (wave * 10 + 10) + (impulse * centerBias * 2) + 5;
                
                bars[i] += (targetHeight - bars[i]) * 0.2;
                const barHeight = Math.max(4, bars[i]);
                
                const gradient = ctx.createLinearGradient(0, 50 - barHeight, 0, 100);
                gradient.addColorStop(0, '#ec4899'); 
                gradient.addColorStop(1, '#8b5cf6'); 

                ctx.fillStyle = gradient;
                
                const x = i * width;
                const y = (canvas.clientHeight / dpr) - barHeight; 
                
                ctx.beginPath();
                ctx.roundRect(x, y, width - barSpacing, barHeight, 4);
                ctx.fill();
            }

            if (isPlaying) {
                animationId = requestAnimationFrame(drawVisualizer);
            }
        }

        function startVisualizer() {
            if (!animationId) {
                drawVisualizer();
            }
        }

        function stopVisualizer() {
            cancelAnimationFrame(animationId);
            animationId = null;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#334155';
            const width = canvas.clientWidth / barCount;
            for (let i = 0; i < barCount; i++) {
                const x = i * width;
                const y = (canvas.clientHeight / dpr) - 4; 
                ctx.beginPath();
                ctx.roundRect(x, y, width - barSpacing, 4, 2);
                ctx.fill();
            }
        }

        stopVisualizer();

        window.addEventListener('resize', () => {
            const rect = canvas.parentNode.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            if (!isPlaying) stopVisualizer();
        });

    </script>
</body>
</html>
